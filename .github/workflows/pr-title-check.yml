name: Validate PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Enforces types like feat, fix, docs, chore, test
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
