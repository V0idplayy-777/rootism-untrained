name: CI
on:
  push: { branches: [main, "arena/**"] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: coding-agent-20b } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install (CPU torch for CI, plus optional app/test deps)
        run: |
          pip install numpy==1.26.4 pytest==8.2.2
          pip install "tokenizers>=0.19" GitPython requests
          pip install "fastapi>=0.111" "uvicorn>=0.30" "httpx>=0.27" flask
          pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests (model forward, tokenizer, agent parsing, sandbox, packing, eval metrics)
        run: python -m pytest tests/ -q
      - name: CLI smoke (no model, no network)
        run: |
          python cli.py doctor
          python cli.py init --list
          python cli.py deploy --dry-run --json > /dev/null
      - name: Smoke — tiny model generate + tokenizer validator
        run: python scripts/verify_model.py --help || true
