name: License Compliance

on:
  pull_request:
    branches: [ main ]

jobs:
  license-check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: coding-agent-20b } }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: coding-agent-20b/requirements.txt }

      - name: Install dependencies
        run: |
          # deepspeed and mpi4py are source-build training extras (they need an
          # MPI/CUDA toolchain) and cannot install on a bare runner, so they are
          # audited by version pin only. Fail if the skip list ever grows, so a
          # new dependency cannot escape the audit silently.
          SKIP='^(deepspeed|mpi4py)'
          skipped=$(grep -cE "$SKIP" requirements.txt)
          if [ "$skipped" -ne 2 ]; then
            echo "Unexpected number of unaudited requirements ($skipped); update this workflow." >&2
            exit 1
          fi
          grep -vE "$SKIP" requirements.txt > /tmp/audit-requirements.txt
          pip install --no-deps -r /tmp/audit-requirements.txt
          pip install pip-licenses

      - name: Check Licenses
        run: |
          # deepspeed (Apache-2.0) and mpi4py (BSD-3-Clause) are pinned in
          # requirements.txt and not installed here; both are permissive.
          # Fails the build if unauthorized licenses are found.
          pip-licenses --fail-on "GPL;AGPL;LGPL"
